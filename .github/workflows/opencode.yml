name: opencode

# Lets /opencode (or /oc) mentions in issues and PRs drive an agent that can
# read the thread, edit code, run ./gradlew tests, and open/update a PR.
# Auth: OpenCode Zen via OPENCODE_API_KEY secret, model pinned to the free
# Muse Spark contributor tier (opencode/muse-spark-1.3-contributor-free).
# GitHub auth: OIDC (id-token: write) exchanged for the opencode-agent App
# installation token — no GITHUB_TOKEN passthrough needed.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Bot comments are ignored: the agent's own replies contain "/opencode"
# (social-card image URL) and would otherwise re-trigger this workflow as
# opencode-agent[bot], which always fails the action's collaborator
# permission check (bots are never collaborators — upstream issue #17224).

jobs:
  opencode:
    if: |
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode')) &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    # A `permissions:` block is a whitelist, not additive: anything not listed
    # here is `none`.
    #   id-token: write — the OIDC exchange only; the agent acts through the
    #     opencode-agent App token, not this GITHUB_TOKEN.
    #   actions: read   — the minimum that lets the agent pull CI logs
    #     (`gh run view <id> --log`) instead of guessing at a red build.
    # Read-only, this repo only, minted per job and dead when the job ends:
    # no personal token ever enters the runner.
    permissions:
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Job-scoped, read-only Actions token (see `permissions:` above) so
          # the agent can read CI logs with `gh`. `gh` reads GH_TOKEN; this is
          # deliberately not named GITHUB_TOKEN, which the action itself
          # consumes when `use_github_token: true` — we stay on the OIDC path.
          GH_TOKEN: ${{ github.token }}
          # OpenCode's own permission system (NOT GitHub's). A headless run has
          # no client to answer an "ask", so every ask deadlocks the job.
          # "*": allow covers the built-in asks (external_directory, doom_loop,
          # *.env reads, ...); the two denies after it win (last match wins) and
          # turn the remaining unanswerable prompts into hard blocks instead.
          # v1 config shape — the action installs the latest v1 release, which
          # reads `permission`, not the v2 `permissions` array. Scoped to this
          # process tree, so local opencode sessions keep their own rules.
          OPENCODE_PERMISSION: '{"*":"allow","doom_loop":"deny","question":"deny"}'
        with:
          model: opencode/muse-spark-1.3-contributor-free
