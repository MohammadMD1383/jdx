name: windows

# Windows verification for the multiplatform slices (issue #52, part of #43),
# promoted to the full product check (issue #56, part of #61).
# The POSIX launcher + installer suites (LauncherScriptTest, InstallScriptTest,
# InstallReleaseScriptTest) are @DisabledOnOs(WINDOWS): they exec #!/bin/sh
# scripts directly (CreateProcess error=193 on Win) and assume POSIX ln/tar
# (tar treats C: as a remote host). This job runs the real thing on a real
# Windows runner instead: the full `check` (product modules, not just `:app`,
# with POSIX-only suites skipping by design — and InstallReleasePs1Test /
# InstallPs1Test exercising install-release.ps1 / install.ps1 under pwsh,
# issue #92), WindowsLauncherScriptTest (static .bat/.ps1 pins + tier-2
# jdx.bat smokes through the real cmd.exe batch interpreter), a jdx.bat
# version + doctor smoke, and the gradlew.bat entry point itself.
#
# Mirrors `.github/workflows/macos.yml` (issue #47): macOS proves the BSD
# userland path, Windows proves the batch/PowerShell path. Both run on every
# push to main and every PR, plus on-demand via workflow_dispatch. The legs
# are independent workflows, so one OS red never hides the others
# (`fail-fast: false` equivalent).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The Windows leg builds through gradlew.bat (cmd) — that IS the proof
      # the Windows wrapper entry point works. POSIX legs use ./gradlew.
      # POSIX-only suites skip here by @DisabledOnOs(WINDOWS); Windows coverage
      # is WindowsLauncherScriptTest (pins + tier-2 jdx.bat smokes).
      - name: Full check (product tests + lint + coverage gates)
        shell: cmd
        run: gradlew.bat check -Pci

      - name: Aggregated test report
        if: always()
        shell: cmd
        run: gradlew.bat testReport -Pci

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-windows
          path: |
            **/build/test-results/**
          if-no-files-found: warn

      - name: Upload HTML test + coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-windows
          path: |
            build/reports/allTests/
            **/build/reports/tests/
            **/build/reports/jacoco/
          if-no-files-found: warn

      - name: Build distribution (Windows)
        shell: cmd
        run: gradlew.bat :app:installDist

      # Each smoke runs its OWN launcher through the real batch interpreter.
      - name: Windows launcher smoke (jdx.bat version)
        run: |
          $reported = (cmd.exe /c "app\build\jdx.bat version" | ForEach-Object { $_.Trim() }) -join "`n"
          if (-not ($reported -match "jdx version")) { Write-Error "jdx.bat version failed: $reported"; exit 1 }
        shell: powershell

      - name: Doctor smoke (jdx.bat doctor)
        shell: cmd
        run: app\build\jdx.bat doctor

      # install-release.ps1 smoke (issue #92): pack the just-built dist as a
      # fake windows zip and install into a temp LOCALAPPDATA — proves the
      # PowerShell installer on a real Windows runner (unit tests already
      # cover the same script under Linux pwsh).
      - name: Windows release-installer smoke (install-release.ps1)
        shell: powershell
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'jdx-install-stage'
          $zipDir = Join-Path $stage 'zip'
          $payload = Join-Path $zipDir 'jdx'
          New-Item -ItemType Directory -Path (Join-Path $payload 'libs') -Force | Out-Null
          Copy-Item app\build\jdx.bat, app\build\jdx.ps1 $payload
          Copy-Item app\build\libs\jdx-*-all.jar (Join-Path $payload 'libs')
          if (Test-Path app\build\libs\jdx.jsa) { Copy-Item app\build\libs\jdx.jsa (Join-Path $payload 'libs') }
          $zip = Join-Path $stage 'jdx-0.0.0-windows.zip'
          Compress-Archive -Path $payload -DestinationPath $zip -Force
          $localAppData = Join-Path $env:RUNNER_TEMP 'jdx-lapp'
          $env:LOCALAPPDATA = $localAppData
          $env:JDX_SKIP_USER_PATH = '1'
          & .\install-release.ps1 -Tarball $zip
          if ($LASTEXITCODE -ne 0) { Write-Error "install-release.ps1 failed with $LASTEXITCODE"; exit 1 }
          $bat = Join-Path $localAppData 'Programs\jdx\jdx.bat'
          if (-not (Test-Path $bat)) { Write-Error "missing installed launcher: $bat"; exit 1 }
          $reported = & $bat version
          if (-not ($reported -match 'jdx version')) { Write-Error "installed jdx.bat version failed: $reported"; exit 1 }
          Write-Host "install-release.ps1 smoke ok: $reported"
