name: mcpb

# Builds and validates the MCP Bundle on pull requests and on main.
# Uploads nothing. The release workflow (release.yml, Linux leg) is what uploads
# jdx-mcp-<version>.mcpb and the stamped server.json. See docs/PROPOSAL.md §17.2.
#
# The job is green only when the official mcpb CLI accepts the staged manifest
# (`mcpb validate`) and packs it (`mcpb pack`), the staged `bin/jdx version`
# reports the project version, and the committed tool list matches `jdx mcp`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcpb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the distribution
        run: ./gradlew :app:installDist

      - name: Validate and pack the MCP Bundle
        run: python3 scripts/pack-mcpb.py pack --strict-server-json
