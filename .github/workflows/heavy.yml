name: heavy

# Heavy tiers as scheduled/manual workflows (issue #59, part of #61).
# Tiers 3-4 are deliberately outside `check`, so they need their own CI home.
# Never on the per-push path: `workflow_dispatch` + `schedule` only.
#
# Corpus story: CI runners have no local jar corpus, so `soak` runs against
# the default corpus dir and skips loudly (visible SKIP) when it is absent —
# green-via-skip per docs/TESTING.md. A checked-in mini-corpus is future work.
# `bench` always exits 0 (never gates); `mutationTest` gates per T-060
# (core >= 80 % fails the run). All three honor the CI timeout relaxation
# from #57 via `-Pci`.

on:
  workflow_dispatch:
  schedule:
    # Nightly soak + bench, weekly mutation (long: ~30 min, index dominates).
    - cron: "0 2 * * *"
    - cron: "0 3 * * 0"

permissions:
  contents: read

concurrency:
  group: heavy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Corpus soak (skips loudly without a corpus)
        run: ./gradlew soak -Pci

      - name: Upload soak results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-results
          path: |
            **/build/test-results/soakTest/
            **/build/reports/tests/soakTest/
          if-no-files-found: warn

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Advisory only: bench always exits 0 (machine variance gates nothing).
      - name: Benchmarks (advisory, never gates)
        run: ./gradlew bench -Pci

      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            **/build/test-results/benchTest/
            **/build/reports/tests/benchTest/
          if-no-files-found: warn

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Gates per T-060: core >= 80 % mutation fails the run; the rest report.
      - name: Mutation testing (core gate >= 80 %)
        run: ./gradlew mutationTest -Pci

      - name: Upload PIT reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-reports
          path: |
            **/build/reports/pitest/
          if-no-files-found: warn
